schema: 1
maintenance:
  mandatory: 'Always update PROJECT_INDEX.yaml in the same change as project work, before committing or releasing. This applies to every agent and every task, including bug fixes, features, architecture, documentation, verification and releases.'
  scope: 'Keep navigation, behavior/invariants, tests, build/release commands, current version and material limitations accurate. Preserve historical release validation records; never record credentials. Read this index first when starting without context.'
project: {name: MDEdit, language: Rust, edition: 2024, rust: '1.95', ui: 'eframe/egui 0.36'}
entry: src/main.rs
navigation:
  src/main.rs: [main, single_instance, icon]
  src/app.rs:
    responsibilities: [application_state, tabs, editor_input, undo_redo, dialogs, settings, clipboard, decorations]
    list_input: [list_keys, list_prefix, toggle_line]
    cursor: [selection, set_selection, insert, char_to_byte, byte_to_char]
    history: [Doc.record, Doc.checkpoint, Doc.step]
    tests: 'inline cfg(test); app_with/frame simulate egui frames without a window'
  src/md.rs:
    responsibilities: [markdown_classification, paragraph_layout, inline_styles, decorations]
    symbols: [build, line, inline, fmt, Look, Deco, Kind]
  src/highlight.rs: [LANGUAGES, Syntax, Span, LayoutCache, shared_token_palette, monospace_layout, config_file_lexers]
  src/highlight/engine.rs: [syntect_theme, incremental_checkpoints, nested_grammars, markdown_fenced_blocks]
  src/highlight/worker.rs: [Worker, Analysis, revisioned_jobs, cancellation, provisional_utf8_remapping]
  src/highlight/bash.rs: bash_lexer
  src/latex.rs: latex_to_unicode
  src/markdown.rs:
    responsibilities: [shared_list_and_quote_prefixes, visual_indent_keys, code_fences, front_matter]
    symbols: [prefix, Prefix, ListMarker, INDENT_SPACES, indent_level, prefix_key, Fence, front_matter_end]
  src/files.rs: [file_browser, file_name, create_empty]
  src/fonts.rs: embedded_and_system_fonts
  src/emoji.rs: [characters, png, texture, layout, paint, paint_character, annotations, name, search]
  src/printing.rs: [pdf, breaks, print, unicode_font_embedding, native_print_portal]
  src/i18n.rs: translated_ui_strings
  src/base64.rs: embedded_image_codec
assets: {assets: embedded_fonts_and_icons, examples: sample_markdown, packaging: desktop_installers, releases: packaged_binaries}
invariants:
  - 'Text is UTF-8; egui cursors count characters, replace_range uses bytes.'
  - 'Markdown is edited directly in TextEdit; src/md.rs supplies a cached galley and decorations.'
  - 'Programmatic edits use checkpoints; preserve selection and undo grouping.'
  - 'Config files and Bash scripts use highlight instead of Markdown; do not apply Markdown editing rules there.'
  - 'Renderer lays out paragraphs separately and combines galleys to preserve hanging indents.'
verification:
  format: cargo fmt --check
  tests: cargo test --offline
  release: cargo build --release --offline
list_editing:
  implementation: {input: 'src/app.rs:list_keys', numbering: 'src/app.rs:numbered_edits + App.renumber_lists', layout: 'src/md.rs:line'}
  keys:
    Enter: 'next sibling; empty item exits list'
    Shift+Enter: 'newline with two spaces beyond existing prefix, no new marker; Enter on continuation starts next sibling'
    Tab: 'indent item with a tab; nested lists render one level farther right'
    Shift+Tab: 'remove leading tab or up to two spaces (one rendered level)'
  numbering:
    trigger: 'changed Markdown before checkpoints and end-of-frame history recording'
    rules: 'preserve first number at root; increment siblings; independent counters per visual indentation and delimiter; tabs equal two spaces; odd/even whitespace runs at the same visual level share a key; new nested lists start at one; ignore fenced code and initial YAML front matter'
    cursor: 'map both character endpoints through byte-based digit replacements'
    history: 'renumber together with edit; unchanged/opened documents and undo/redo snapshots remain untouched'
  layout: 'indented continuation text gets a hanging indent; empty marker gets normal line height'
  regression_tests:
    - shift_enter_continues_text_and_enter_starts_next_item
    - both_new_tab_shortcuts_work
    - nested_numbering_handles_mixed_indentation_and_first_item_deletion
    - deleting_items_at_second_nested_level_renumbers_in_editor
    - tab_nests_items_and_numbering_maps_unicode_cursor
    - numbering_tracks_siblings_and_preserves_code_and_starts
    - inserting_and_deleting_numbered_items_updates_following_numbers
    - empty_bullet_height_and_continuation_indent_are_stable
  test_harness: 'egui headless run_ui outputs must clear textures_delta; texture tests declare max_texture_side'
last_verification: {tests: 90, result: passed, commands: ["cargo test --offline", "cargo fmt --check", "git diff --check", "cargo clippy --offline --all-targets -- -D warnings", "cargo build --release --offline"]}
deployment:
  desktop_launcher: /home/adam/.local/share/applications/mdedit.desktop
  executable: target/release/mdedit
  path_alias: /10tb/apps/MDEditor
  workflow: "After every project change run a fresh cargo build --release --offline (explicit user preference); cargo test builds only test executables. Restart all editor windows to use the new binary (single instance)."
shortcuts: {new_tab: [Ctrl+N, Ctrl+T], source: "src/app.rs:shortcuts; about_rows derives its labels from this table"}
review_fixes:
  about: 'src/app.rs:modals uses translated Code written with the help of + Claude/Codex.; shared by all 23 languages'
  images: 'load_image caps image dimensions to min(MAX_TEXTURE_SIDE, egui device max_texture_side); regression test declares 1024px device limit'
  numbering_performance: 'renumber_lists converts sorted digit byte offsets to character offsets in one forward pass'
  replacement: 'replace_one uses insert; replace_all uses App.checkpoint so normalization and replacement share undo history'
  tests: [replacement_keeps_numbering_and_undo_together, shift_tab_reverses_one_rendered_indentation_level]
release_workflow:
  current_version: 0.1.10
  repository: ordigital/mdeditor
  branch: master
  tag: v0.1.10
  release_url: https://github.com/ordigital/mdeditor/releases/tag/v0.1.10
  instructions: packaging/RELEASING.md
  notes: packaging/release-notes-0.1.10.md
  linux: {script: packaging/build-appimage.sh, build: 'KEEP_BUILD=1 sh packaging/build-appimage.sh', base: 'Docker ubuntu:22.04', glibc_minimum: '2.35', artifact: releases/MDEdit-0.1.10-x86_64.AppImage}
  windows: {script: packaging/build-windows.sh, target: x86_64-pc-windows-gnu, compiler: x86_64-w64-mingw32-gcc, artifact: releases/MDEdit-0.1.10-windows-x86_64.zip, contents: [MDEdit.exe, LICENSE, licenses/]}
  checksums: 'Both packages have basename.sha256 sidecars with relative filenames; verify from releases/.'
  publication: 'Annotated v<version> tag; atomic push of master and tag; gh release create --verify-tag --notes-file with two packages and two SHA-256 files.'
  caches: [releases/build/target, 'Docker volume mdedit-cargo', 'Docker volume mdedit-rustup']
  requirements: 'Docker daemon running and socket accessible, appimagetool, MinGW-w64, Rust Windows GNU target, Python >=3.11, gh authentication, GitHub SSH access.'
  validation: '90 tests; fmt; Clippy -D warnings; package CRC/content; SHA-256; Linux max GLIBC_2.35; Windows DLL imports. Windows/Wine runtime not tested for 0.1.10.'
  git_policy: 'releases/ is ignored; commit source/index/scripts/notes and version bump, upload binaries as GitHub release assets; never force-push existing tags.'
linked_pages_and_toolbar:
  status: 'Included in release v0.1.7.'
  input: 'Ctrl+Shift+K -> Action.NewPage -> begin_new_page -> NewPage modal -> create_linked_page'
  confirmation: 'Enter or translated Save; Cancel/Escape leaves source and filesystem unchanged.'
  directory: 'Document parent first; browser directory for unsaved documents; otherwise process cwd.'
  filename: 'Selection prefills name; append .md unless .md/.markdown supplied; only a single valid filename; create_new prevents overwrite.'
  source: 'Store document ID, character selection and original text; verify unchanged source before creating file; insert link as one undo step. Undo removes link but keeps created file.'
  links: 'Escape label backslashes/brackets; percent-encode destination UTF-8 bytes. md.decode_path decodes once in app.resolve after fragment splitting; md.parse_link handles escaped/nested label brackets.'
  toolbar: 'Original fixed bar replaced by App.selection_popup; shared formatting_buttons/formatting_button registry renders four 26x26 buttons per row, with translated tooltips and shortcuts. Automatic popup is for nonempty Markdown selections; hidden for source files/no document/modals.'
  actions: 'formatting_buttons routes existing actions: normal text (P) first, bold, italic, strike, inline code, highlight, link, new linked page, H1-H6, bullet/ordered/task lists, quote, image.'
  numbered_format: 'Fmt.Ordered + toggle_line adds/removes markers; checkpoint numbering normalizes selected lines.'
  localization: 'New linked page, Invalid file name and Numbered list added to all 22 non-English tables; English uses source keys.'
  icon_rendering: "formatting_button draws highlight, links, bullet/ordered lists, checkbox, quote and image as painter geometry; remaining labels use ASCII. Highlight uses an outlined diagonal marker with a filled chisel tip and an underline. Link uses two diagonal chain links; new linked page uses the same chain with a plus."
  continuation_indent: "Shift+Enter appends exactly two spaces after the original prefix for bullets, ordered lists and tasks at every nesting level; repeated breaks do not accumulate indentation."
  regression_tests: [shift_enter_uses_one_compact_step_for_tasks_and_nested_lists, linked_page_shortcut_enter_creates_file_and_followable_link, linked_page_preserves_existing_files_and_rejects_paths, linked_page_uses_browser_folder_for_unsaved_document, selection_tools_cover_all_formatting_and_numbered_lists, clicking_selection_tools_keeps_editor_selection]
quote_indentation:
  formatting: 'src/app.rs:toggle_line(Fmt.Quote) adds/removes > after existing whitespace; never moves indentation inside the quote.'
  layout: 'src/md.rs:line recognizes whitespace before > and stores its visual nesting steps in Deco.Quote.indent; text/wrapped rows include indent plus quote depth.'
  painting: 'src/app.rs:paint_decos offsets quote bars and callout backgrounds by Deco.Quote.indent * Look.indent().'
  tests: [quote_format_preserves_indentation_and_toggles_back, indented_quotes_align_bars_text_and_wrapped_rows]
dry_kiss_refactor:
  shared_syntax: 'src/markdown.rs owns list/quote prefix parsing for app.list_prefix, numbered_edits, toggle_line and md.line. Prefix indices are UTF-8 byte offsets; marker digits are parsed into u64 only by editing logic.'
  indentation: 'INDENT_SPACES=2 governs tab width, visual levels, canonical numbering keys, Shift+Enter and Shift+Tab. Canonical keys exclude syntactic spaces after > and preserve nesting before/after quote markers.'
  block_boundaries: 'Fence stores marker and full opening length; closes only on the same marker with at least that length. Rendering/numbering share Fence and front_matter_end; closed YAML headers accept --- or ..., unclosed --- remains normal Markdown.'
  files: 'files.file_name validates a single trimmed filename for both creation dialogs; files.create_empty uses create_new to prevent overwrite. Browser retains existing extensions; linked Markdown pages append .md as before.'
  toolbar: 'formatting_buttons returns a static slice; vector icons have empty text labels; ASCII text buttons retain labels. The registry needs no per-frame allocation; vector glyph paths use small point vectors.'
  modals: 'App.has_modal is the shared gate for formatting buttons and editor keyboard shortcuts.'
  tests: [prefixes_share_visual_indentation_and_marker_boundaries, code_fences_require_matching_character_and_at_least_opening_length, front_matter_requires_a_closing_delimiter, file_names_are_portable_single_components, numbering_and_layout_agree_on_odd_indents_and_long_fences, browser_creation_reuses_filename_validation_and_never_overwrites]
bash_highlighting:
  integration: 'Syntax.Bash in highlight.rs; dispatches to child module highlight/bash.rs using existing Class/paint/lines/palette/layout. No new dependencies or separate rendering path.'
  detection: 'Case-insensitive .sh/.bash extensions and filenames .bashrc, .bash_profile, .bash_login, .bash_logout, .bash_aliases, .profile. Detection is filename-based, not shebang-based.'
  scope: 'Plain-text shell files and fenced sh/bash/shell Markdown blocks via the common span pipeline.'
  tokens: 'Control-flow keywords and common builtins, assignments, parameters, single/double/ANSI-C quotes, escapes, multiline strings, comments, numeric literals and operators/redirections.'
  heredocs: 'FIFO delimiters, quote removal, <<- tab stripping; quoted delimiter bodies stay literal, unquoted bodies highlight parameters. Arithmetic shifts and <<< here-strings do not start heredocs.'
  limits: 'Lightweight lexical coloring, not a complete Bash parser; nested command substitutions inside double-quoted strings are not recursively parsed.'
  reference: https://www.gnu.org/software/bash/manual/bash.html
  tests: [syntax_follows_the_file_name, bash_colors_control_flow_assignments_parameters_and_comments, bash_respects_quotes_escapes_and_multiline_strings, bash_heredocs_obey_quoted_delimiters_and_tab_stripping, bash_shifts_and_here_strings_do_not_start_heredocs, random_text_does_not_panic_and_lays_out]
save_dialog_extensions:
  implementation: 'src/app.rs:App.save'
  filter: 'Use the all-files wildcard (*) with translated Files label; a native Markdown-only filter could force .md onto an explicitly typed .sh filename.'
  filename: 'Save As suggests the complete existing filename, including its extension. New documents suggest Untitled.md.'
  default: 'Append .md only when the path returned by the dialog has no extension; preserve explicit .sh/.bash/.xml/.json/.txt/etc. Syntax detection runs on the resulting path.'
grammar_highlighting:
  status: 'Included in release v0.1.7.'
  decision: 'syntect 5.3 + regex-onig, default-syntaxes only; Tree-sitter stays in the standalone comparison tool, not the application dependency graph.'
  supported: [html, css, php, python, rust, c, cpp, go, javascript]
  registry: 'src/highlight.rs:LANGUAGES owns extensions/filenames/fenced aliases and engine grammar keys. Add Syntax variant + entry for future supported grammars; registry coverage test checks bundled grammar presence.'
  nested: 'Syntect context stacks handle PHP/HTML/CSS/JS. Markdown bodies use the same engine; unknown fence aliases retain plain-code styling.'
  architecture: docs/syntax-highlighting.md
  measurements: docs/benchmarks/
  comparison_tool: tools/syntax-probe/
  lifecycle: 'One lazy syntax-analysis thread per App. Per-document Analysis sees the actual TextBuffer before galley lookup, revisions text/grammar changes, coalesces queued requests and accepts exact-revision results only.'
  incremental: 'Checkpoint parser/highlighter states every 32 lines; rewind before changed text and stop only at an unchanged suffix with matching states. Unterminated constructs may require the full suffix.'
  cache: 'Analysis independent of cursor/width/font. Galley key uses analysis revision, visual parameters and Markdown-only cursor line. LayoutCache retains per-line galleys across egui frame cache expiry.'
  offsets: 'Span ranges are UTF-8 bytes. Provisional colors are remapped only over unchanged prefix/suffix text; new/replaced bytes stay plain until the worker corrects lexical context.'
  limits: 'Code file/block with a line >262144 bytes falls back to plain text. Regex calls are not preempted internally. Whole-document TextEdit layout still costs about 28 ms for a 1 MB edit in the measured fixture.'
  performance: 'Measured on i9-13900KF, release/headless egui: 1 MB code cursor p95 about 0.25-0.29 ms, previously 28-30 ms/frame; 100 KB nested PHP edit first frame 2.7 ms and colors 4.8 ms. See report for cold costs, RSS, fixtures and caveats.'
  binaries: 'Local release: Linux 27844928 bytes, Windows 20527104 bytes; Oniguruma linked statically (no extra runtime DLL/shared library).'
  verification: '78 regular tests plus 3 ignored manual release benchmarks; fmt; Clippy -D warnings; Linux + MinGW Windows release builds. Windows runtime not tested.'
  commands: ['cargo test --release --offline --locked benchmark_ -- --ignored --nocapture --test-threads=1', 'cargo run --release --offline --locked --manifest-path tools/syntax-probe/Cargo.toml', 'cargo run --release --offline --locked --no-default-features --features onig --manifest-path tools/syntax-probe/Cargo.toml', 'cargo build --release --offline --locked --target x86_64-pc-windows-gnu']

file_drop:
  implementation: 'src/app.rs: App.ui consumes raw.dropped_files before editor rendering; native path via DroppedFile.path()'
  behavior: 'Open regular dropped files through open_path; multiple files supported; existing tab reused; directories ignored; standard size/binary guards retained.'
  regression: 'dropped_html_opens_and_colors_long_lines tests native drop, duplicate reuse and asynchronous HTML coloring on a >22 KB line.'
  html_fix: 'Previous 16 KiB single-line guard suppressed minified HTML; now 256 KiB. Rebuild target/release/mdedit and restart all instances.'

open_dialog_filters:
  implementation: 'src/app.rs:App.run(Action.Open)'
  default: 'First filter is all files (*) with translated Files label; Markdown (md/markdown/txt) is an optional second filter selected manually.'
  verification: 'cargo fmt --check; git diff --check; cargo build --release --offline --locked. Native dialog selection not exercised in headless tests.'

linux_window_backend:
  implementation: 'src/main.rs: NativeOptions.event_loop_builder + Linux-only direct winit dependency (same locked 0.30.13 as eframe)'
  policy: 'Prefer X11/XWayland if DISPLAY is nonempty; otherwise keep default native Wayland. No environment mutation; Windows unchanged.'
  reason: 'winit 0.30.13 Wayland backend has no file-drop event implementation; App.ui alone cannot fix native drag/drop. Upstream https://github.com/rust-windowing/winit/issues/1881'
  limitation: 'Wayland-only systems without XWayland still cannot receive file drops with this windowing version. Headless drop regression tests application handling, not compositor transport.'

view_width:
  implementation: 'src/app.rs: Config.view_width (0..3), VIEW_WIDTHS, view_geometry, Action.CycleWidth, View menu'
  modes: 'Narrow/Medium/Wide/Full; Polish Wąski/Średni/Szeroki/Pełny. F2 cycles 0->1->2->3->0; translated in all 23 languages and listed in About.'
  geometry: 'Linear interpolation between original 720px-max centered reading column and former optimize=false full layout, including left offset and line-number gutter; narrow windows use available width.'
  persistence: 'view_width=0..3; default 0. Legacy optimize=1 maps to 0, optimize=0 maps to 3. Explicit new key takes precedence; invalid values keep current/default.'
  code_font: 'Editor adds 1.5px to Look.size for detected syntax files before monospace scaling; Markdown prose and fenced blocks unchanged. Cache key includes resulting size.'
  tests: [width_modes_cycle_persist_and_migrate_old_settings, settings_round_trip_and_reject_bad_values, about_lists_every_shortcut]
release_0_1_7_validation:
  checks: '76 passed, 3 manual benchmarks ignored; fmt, diff check, Clippy -D warnings; local Linux release; Docker Ubuntu 22.04 AppImage; MinGW Windows ZIP.'
  artifacts: {appimage_bytes: 11655672, windows_zip_bytes: 9109720}
  integrity: 'SHA-256 sidecars verified; ZIP CRC/content and EXE equality verified; ELF max GLIBC_2.35; PE imports contain system DLLs only, no external Oniguruma DLL.'
  limitations: 'No Windows/Wine runtime test or interactive desktop drag/drop test for 0.1.7.'

manual_syntax:
  implementation: 'src/app.rs: SyntaxMode, Doc.set_syntax, App.menu_bar Syntax menu; src/highlight.rs: Language.name, Syntax.available/name'
  state: 'Per-tab SyntaxMode Automatic/Markdown/Language(Syntax), defaults Automatic. Doc.syntax is the derived effective syntax; set_syntax refreshes it whenever mode/path changes. Save As preserves mode and refreshes after replacing path.'
  menu: 'Automatic, explicit Markdown, then all 16 existing registry languages. Disabled with no document or while a modal is open. Translated Syntax/Automatic in all 23 UI languages; language names are canonical.'
  registry: 'LANGUAGES owns canonical display names along with detection/aliases/engine keys. Add a registered language once to include it in the menu; do not maintain another UI language list.'
  behavior: 'Switching modes does not change text, path, dirty flag or undo history. Existing syntax revision checks refresh/cache colors and reject obsolete async results; effective syntax gates Markdown tools and editing rules.'
  persistence: 'Runtime tab preference only; kept across saving and switching tabs, reset on close/reopen. No global config, on-disk file metadata or new dependencies.'
  tests: [manual_syntax_is_tab_local_and_preserves_text_history_and_save, syntax_menu_uses_unique_named_registry_entries]
  review: 'DRY: registry reused for labels/options. KISS: one tab mode and existing analysis pipeline. YAGNI: no extra grammar, parser, persistence layer or generic menu framework.'

release_0_1_8_validation:
  checks: '78 passed, 3 ignored manual benchmarks; fmt, diff check, Clippy -D warnings; local release build; Docker Ubuntu 22.04 AppImage; MinGW Windows ZIP.'
  integrity: 'SHA-256 sidecars verified; ZIP CRC/content and EXE equality verified; ELF max GLIBC_2.35; PE imports checked, no external Oniguruma or MinGW C++ runtime DLL.'
  limitations: 'No interactive desktop or Windows/Wine runtime tests.'

version_display:
  implementation: 'src/main.rs: APP_TITLE = concat!("MDEdit ", env!("CARGO_PKG_VERSION")); initial viewport title, App.ui dynamic title and About modal title share it.'
  release_exception: 'User explicitly authorized replacing published v0.1.8 for this version-display fix. Move only tag v0.1.8 to the new commit using force-with-lease against the inspected remote tag; replace the four release assets and update release notes. Keep master fast-forward; do not generalize this exception to future releases.'

file_change_detection:
  implementation: 'src/app.rs: App.open_path/check_disk/reload_doc/modals, Doc.disk_hash, App.file_prompt/next_disk_check'
  repeated_open: 'Canonicalize incoming paths and reuse the existing tab. Dirty buffers ask whether to save; declining keeps the buffer and tab. Clean buffers check disk immediately.'
  polling: 'Request repaint and compare normalized UTF-8 content hashes every five seconds, including inactive and dirty tabs; defer while a modal is open. Stop at the first changed file, identify prompts by stable document ID.'
  choices: 'External changes offer Reload, Save (overwrite disk with editor buffer), Do nothing/Escape. Acknowledged disk content is remembered so dismissal does not repeat until another content change. Successful saves update the baseline.'
  reload: 'Re-read current disk content on confirmation, preserve syntax mode and tab identity, detect CRLF, reset saved text/cache/stats and retain the previous buffer as an undo step.'
  safeguards: 'Existing size/binary guards apply to polling and reload. Missing, unreadable, binary and oversized files are skipped during polling; reload failures show an error and keep the prompt/buffer. Changes only to CRLF versus LF do not trigger a prompt. Polling reads guarded files synchronously on the UI thread.'
  localization: 'Five new dialog strings in all 22 non-English tables; English uses source keys.'
  tests: [repeated_open_and_external_changes_preserve_user_choices]

release_0_1_9_validation:
  checks: '80 passed, 3 ignored manual benchmarks; fmt, diff check, Clippy -D warnings; local release build; Docker Ubuntu 22.04 AppImage; MinGW Windows ZIP.'
  integrity: 'SHA-256 sidecars, ZIP CRC/content and EXE equality, ELF max GLIBC_2.35 and PE imports checked.'
  limitations: 'No interactive desktop or Windows/Wine runtime tests.'

ctrl_click_navigation:
  implementation: 'src/app.rs: App.editor, link_hit, paint_decos/paint_table; src/md.rs: TableRow.links/layout_table'
  behavior: 'Ctrl (or platform Command) plus primary click suppresses TextEdit pointer editing and preserves the source cursor, so rendered tables/blocks stay rendered. Keyboard shortcuts remain active outside pointer navigation.'
  tables: 'Keep per-cell link decorations alongside galleys. Hit-test using the painted cell origin and alignment, wrapped glyph rows, clipping and character ranges; route links through existing App.open_link.'
  tests: [ctrl_click_table_link_keeps_preview_and_source_cursor]
  release_exception: 'User explicitly authorized folding this fix into the preceding commit/push and replacing published v0.1.9. Amend only the latest release commit, move v0.1.9, push master/tag atomically with explicit force-with-lease against inspected remote refs, then replace four assets and notes. This exception does not authorize future history rewrites.'

coffee_link:
  implementation: 'src/app.rs: COFFEE_LABEL/COFFEE_URL, App.status_bar/document_status and About modal; README.md/README.pl.md'
  behavior: 'Show the exact label ♡ Buy me a coffee in every language, linking to https://buymeacoffee.com/adamstrad. Right-aligned in the status bar, including when there is no document; at the very bottom of About below OK; also near the top of both English and Polish README files.'
  release_exception: 'User explicitly authorized adding this link to the preceding commit/push and replacing v0.1.9 again. Amend latest release commit, move only v0.1.9 and atomically push master/tag with explicit force-with-lease against inspected refs; replace four assets and notes.'

printing_and_pdf:
  implementation: 'src/app.rs: Action.ExportPdf/Print, App.document_pdf, print_job; src/printing.rs: pdf/breaks/print'
  menu: 'File -> Export PDF… and Print…; disabled with no document or a modal; printing disabled while its worker is active. Ctrl+P prints and Ctrl+Shift+E exports, from the shared shortcuts table also used by menu labels and About. Three new strings translated in all 22 non-English tables.'
  shared_layout: 'Separate egui context copies current font definitions and reuses md.build(cursor=None) and paint_decos, without touching editor caches, selection, history or saved state. Exports current buffer including unsaved changes. Detected source files use literal monospace text.'
  pdf: 'krilla without default features, raster-images only; ttf-parser resolves glyphs from existing font chains. Embedded variable fonts and ToUnicode text mappings preserve search/copy; glyph advances come from the editor. No browser, external converter, Markdown parser duplication or screenshot export.'
  paper: 'Fixed A4 portrait, 42pt margins, 11pt body/10pt source, dark text on white paper; keep normal rows/table rows together, constrain images to content area. Reuse vector decorations and local/data images. No print settings or PDF configuration UI.'
  linux: 'Existing ashpd 0.11 async-std + pollster exposes portal PreparePrint (system dialog) followed by Print with the returned token. KDE requires the prepared printer; ashpd 0.11 encodes an absent token as zero, which caused the original Other response. Worker owns an immediately unlinked temporary PDF fd, treats cancellation as success and returns errors to the UI.'
  windows: 'PowerShell Start-Process -Verb Print invokes the registered PDF handler; requires an application supporting the print verb. Handler decides whether to display a dialog. Temporary input remains for asynchronous viewer access until OS temp cleanup.'
  limitations: 'Native dialogs and physical printing not exercised headlessly. Fixed A4 independent of printer options; no syntax colors, PDF link annotations or page headers. Rows taller than a page can split; complex scripts inherit the editor glyph layout. Missing font glyphs report an error. Other platforms open the PDF viewer.'
  tests: [pdf_exports_unsaved_unicode_tables_and_multiple_pages_without_editing, pdf_handles_empty_and_source_documents, printing_actions_are_translated_in_every_language, print_and_export_shortcuts_do_not_trigger_inline_code]
  verification: 'PDF regression optionally uses installed pdftotext to verify Polish Unicode/table extraction, hidden Markdown markers and exactly one copy of each row across pages. Manual pdfinfo/pdfimages/pdftoppm check confirms A4, embedded image and readable formatting. cargo check --offline --target x86_64-pc-windows-gnu passes.'

selection_tools_and_emoji:
  implementation: 'src/app.rs: EditorSelection/SelectionTools, App.editor/selection_popup/dismiss_selection_tools, formatting_grid, tool_content_size, Action.Emoji; src/emoji.rs: characters'
  visibility: 'Remove fixed Panel.top(formatting). Nonempty Markdown selections open tools after drag release or keyboard selection; empty selection, source syntax, another tab or a modal hides formatting. Single pointer press anywhere outside closes without swallowing the click. Escape also closes. seen_selection prevents reopening unchanged dismissed selections; dragging a fresh selection resets it.'
  geometry: 'Four columns with 3pt gaps and equal 8pt frame padding. Formatting keeps strict 26x26 cells, 12pt labels and five rows. Emoji uses larger 36x36 cells (28pt images), six visible rows and a full-width 28pt search input above them. Separate fixed content sizes keep results/empty state from resizing the window. Top-left Area placement derived from the preferred bottom-left anchor avoids size-change pivot drift. Emoji scrollbars float in the right frame padding; no extra right content gutter. Painter-centered bitmap emoji cannot change row height or shift grid columns. Frame.popup with CHROME fill matches existing dialog frame. Preferred bottom-left anchor is 6pt above the sorted selection end, using actual TextEdit galley/screen coordinates; clamp to viewport edges if needed. Scroll/font/width changes refresh the anchor.'
  actions: 'Formatting reuses existing actions and preserves source selection/focus. Emoji uses App.insert and its Unicode character indices/checkpoints, replaces selection or inserts at caret, closes after picking and supports Undo. Popup is a nonmodal foreground Area; other editor controls and shortcuts remain usable.'
  emoji: 'Ctrl+~ (COMMAND + Backtick, also accepts Shift for the tilde) or translated Edit -> Insert emoji… switches the popup to a larger virtualized vertical ScrollArea with an autofocus search input. No selection required. Shortcut labels/About use the shared table. New UI string translated in all 22 non-English tables.'
  choice: 'No new transitive dependencies. Embedded assets/NotoColorEmoji.ttf (unmodified Google Noto Color Emoji 2.057, OFL-1.1; provenance/hash in assets/NotoEmoji-README.txt) supplies CBDT PNG glyphs read by existing ttf-parser and decoded by image. Palette intersects bundled proportional cmap with available color bitmaps, deduplicates/caches with OnceLock/BTreeSet, faces first. Single-codepoint emoji/symbols only, no standalone skin modifiers or ZWJ/flag sequence catalogue.'
  color_rendering: 'One context texture cache is shared by picker, editor and print rendering. Copy-on-write emoji.layout collapses only monochrome glyph quads (including under selection color overrides), preserving source Unicode, glyph advances, wrapping and selection backgrounds. emoji.paint overlays colored PNGs at glyph positions in prose, code, tables and formulas. PDF retains invisible Unicode text for search/copy beneath matching color images; split text runs when switching between colored emoji and ordinary text.'
  font_distribution: 'NotoEmoji-LICENSE.txt is shipped by Windows ZIP and Linux AppImage scripts alongside existing font licenses. The embedded font works independently of system fonts on Linux/Windows.'
  tests: [selection_popup_is_contextual_anchored_and_dismissed_until_reselection, larger_emoji_popup_scrolls_and_inserts_unicode_with_undo, clicking_selection_tools_keeps_editor_selection, selection_tools_cover_all_formatting_and_numbered_lists, palette_uses_bundled_glyphs_and_contains_common_emoji, color_glyphs_preserve_text_and_font_cache]

emoji_search:
  implementation: 'src/app.rs: SelectionTools.query/focus_search, emoji_content_size, EMOJI_BUTTON/EMOJI_SEARCH_ID, App.selection_popup/editor/ui; src/emoji.rs: annotations/name/search'
  data: 'assets/emoji-search.tsv.gz contains Unicode CLDR release-48 short names and search keywords for all 23 Lang codes; assets/Unicode-LICENSE.txt and assets/EmojiSearch-README.txt record license/provenance. Existing flate2 (already in image dependency graph) is now direct to inflate the approximately 1 MB embedded index once; no new transitive crate or runtime network access.'
  matching: 'Case-insensitive substring matching, all whitespace-separated query words required; current UI language plus English fallback; generated terms include accent-free spellings. Direct emoji queries accept a variation selector. Empty query shows all supported color emoji; no matches shows a translated empty state; localized names are button tooltips.'
  editing: 'Autofocus search on open, clear query on reopen, filter every input change and reset scroll to top. Disable editor shortcuts/list keys/image paste while search owns focus. A stable source selection snapshot survives TextEdit losing focus; click inserts into that original Unicode range through App.insert/undo. Escape/outside dismissal restores the source selection; outside pointer actions still propagate normally.'
  maintenance: 'python3 tools/update_emoji_search.py downloads pinned CLDR annotation XML/LICENSE using only Python stdlib, derives language codes from src/i18n.rs, generates deterministic gzip. Run only to refresh vendored data, never during builds. Existing package license globs include Unicode-LICENSE.txt automatically.'
  localization: 'Search emoji… and No emoji found translated in all 22 non-English tables; English source keys. All 23 locales have CLDR metadata and continue to accept English queries.'
  tests: [search_matches_localized_keywords_english_and_emoji, emoji_search_filters_live_without_editing_the_source_selection, larger_emoji_popup_scrolls_and_inserts_unicode_with_undo]

