[package]
name = "mdedit-syntax-probe"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = ["fancy"]
fancy = ["syntect/regex-fancy"]
onig = ["syntect/regex-onig"]

[dependencies]
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes"] }
tree-sitter-highlight = "0.27.1"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-php = "0.25.1"
tree-sitter-language = "0.1.9"
