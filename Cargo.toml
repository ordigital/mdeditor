[package]
name = "mdedit"
version = "0.1.7"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["ORDIGITAL Adam Mateusz Brożyński"]
description = "WYSIWYG Markdown editor in the style of Obsidian's live preview"
repository = "https://github.com/ordigital/mdeditor"
readme = "README.md"
keywords = ["markdown", "editor", "wysiwyg", "egui"]
categories = ["text-editors"]

[dependencies]
eframe = "0.36"
arboard = { version = "3.6", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
rfd = "0.16"
open = "5"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-onig"] }

# winit 0.30 has no native Wayland file-drop support; use its typed X11 hook.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
